<nav class="navbar">
  <div class="navbar-left">
    <button class="hamburger-btn" (click)="onHamburger()" aria-label="Menú">
      <span class="ham-bar"></span>
      <span class="ham-bar"></span>
      <span class="ham-bar"></span>
    </button>
    <div class="navbar-brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">Workflow Platform</span>
    </div>
  </div>

  <div class="navbar-right">
    <!-- Avatar + dropdown -->
    <div class="avatar-wrapper" (click)="toggleMenu()">
      <div class="avatar-circle">
        @if (avatarUrl) {
          <img [src]="avatarUrl" class="avatar-img" alt="avatar" />
        } @else {
          <span class="avatar-initials">{{ initials }}</span>
        }
      </div>
      <div class="avatar-info">
        <span class="avatar-name">{{ userName }}</span>
        <span class="avatar-role">{{ roleLabel }}</span>
      </div>
      <span class="avatar-chevron">{{ showMenu ? '▲' : '▼' }}</span>

      @if (showMenu) {
        <div class="profile-dropdown">
          <div class="dropdown-header">
            <div class="dh-avatar">
              @if (avatarUrl) {
                <img [src]="avatarUrl" class="avatar-img" alt="avatar" />
              } @else {
                <span class="avatar-initials">{{ initials }}</span>
              }
            </div>
            <div>
              <p class="dh-name">{{ userName }}</p>
              <p class="dh-role">{{ roleLabel }}</p>
            </div>
          </div>
          <hr class="dropdown-sep" />
          <button class="dropdown-item" (click)="goProfile()">
            <span>👤</span> Mi Perfil
          </button>
          <hr class="dropdown-sep" />
          <button class="dropdown-item dropdown-item--danger" (click)="logout()">
            <span>🚪</span> Cerrar sesión
          </button>
        </div>
      }
    </div>
  </div>
</nav>
